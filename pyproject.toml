[project]
name = "rbc"
version = "0.1.0"
description = "Standalone implementations of the RBC protocol for anatomical and functional pre-processing."
authors = [{name = "CMI DAIR", email = "dair@childmind.org"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "nibabel>=5.3.3",
  "niwrap>=0.8.3",
  "niwrap-helper>=0.7.0",
  "numpy>=2.4.1",
  "scipy>=1.17.0"
]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "mypy>=1.13.0",
  "pre-commit>=4.0.1",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.1",
  "deptry>=0.23.0"
]
docs = ["pdoc>=15.0.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "unit: Fast (<1s) unit tests (e.g. utilities, BIDS parsing, file operations",
  "integration: Medium (1-5 min) integration tests with small/downsampled data",
  "slow: Long (30+ min) tests; skip on CI",
  "full_pipeline: End-to-end workflow tests; skip on CI"
]

[tool.coverage.report]
omit = ["src/rbc/core/resources/"]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
indent-width = 4
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = ["ANN", "D", "E", "F", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = []

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"
