name: Python Tests

permissions:
  contents: read

on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: Run end-to-end tests
        required: false
        default: false
        type: boolean

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v6
    - name: Setup venv
      uses: ./.github/actions/setup-venv
    - name: Run quick tests
      id: run-quick-tests
      shell: bash
      run: >
        uv run pytest \
          -m "unit" \
          --junitxml=pytest-quick.xml \
          --cov=src tests \
          --log-level=DEBUG \
          --verbose

  unit-ubuntu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Setup venv
      uses: ./.github/actions/setup-venv
    - name: Run quick tests
      id: run-quick-tests
      shell: bash
      run: >
        uv run pytest \
          -m "not slow and not full_pipeline" \
          --runner=docker \
          --junitxml=pytest-quick.xml \
          --cov=src tests \
          --log-level=DEBUG \
          --verbose

    - name: Run slow tests
      if: github.event_name == 'workflow_dispatch'
      shell: bash
      run: >
        uv run pytest \
          -m "slow" \
          --runner=docker \
          --junitxml=pytest-slow.xml \
          --cov=src tests \
          --cov-append \
          --verbose

    - name: Run full pipeline tests
      if: github.event_name == 'workflow_dispatch' && inputs.e2e == true
      shell: bash
      run: >
        uv run pytest \
          -m "full_pipeline" \
          --runner=docker \
          --junitxml=pytest-full.xml \
          --cov=src tests \
          --cov-append \
          --verbose

  ruff:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Setup venv
      uses: ./.github/actions/setup-venv
      with:
        only-dev: true
    - name: Ruff format
      run: uv run ruff format --check
    - name: Ruff check
      run: uv run ruff check

  mypy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Setup venv
      uses: ./.github/actions/setup-venv
    - run: |
        uv run mypy .

  deptry:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Setup venv
      uses: ./.github/actions/setup-venv
    - run: |-
        uv run deptry ./src
