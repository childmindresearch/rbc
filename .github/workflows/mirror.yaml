name: Sync to Public Mirror

on:
  push:
    branches:
    - main
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0   # Full history

    - name: Push to public mirror
      run: |
        git remote add mirror https://x-access-token:${{ secrets.MIRROR_PAT }}@github.com/${{ github.repository_owner }}/rbc-mirror.git
        git push mirror main --force
