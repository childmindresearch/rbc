name: Cache Diagnose

on:
  workflow_dispatch:
    inputs:
      top_n:
        description: "Number of top-tool rows to show in summary"
        default: "20"
        type: string
      styxcache_dir:
        description: "Override persistent styxcache directory"
        default: ""
        type: string

jobs:
  diagnose:
    runs-on: arcana
    env:
      STYXCACHE_DIR_OVERRIDE: ${{ inputs.styxcache_dir }}
      TOP_N: ${{ inputs.top_n }}
    steps:
    - name: Diagnose styxcache
      shell: bash
      run: |
        # sort | head trips pipefail when head closes early; accept that SIGPIPE.
        set +o pipefail
        DIR="${STYXCACHE_DIR_OVERRIDE:-$HOME/.cache/rbc-styxcache}"
        if [ ! -d "$DIR" ]; then
          echo "cache dir missing: $DIR"
          exit 0
        fi

        emit() { tee -a "$GITHUB_STEP_SUMMARY"; }

        # Build manifest: one row per cache entry with mtime + size + tool + shard id.
        mkdir -p out
        MANIFEST=out/styxcache_manifest.tsv
        printf "mtime_utc\tsize_kb\ttool\tshard\n" > "$MANIFEST"
        find "$DIR" -mindepth 2 -maxdepth 2 -type d -printf '%T@\t%p\n' \
          | sort -n \
          | while IFS=$'\t' read -r ts path; do
              tool=$(awk '/^#!/ || /^set / || /^$/ || /^export / {next} {print $1; exit}' "$path/run.sh" 2>/dev/null || echo "?")
              size_kb=$(du -sk "$path" 2>/dev/null | awk '{print $1}')
              when=$(date -u -d "@${ts%.*}" '+%Y-%m-%dT%H:%M:%SZ')
              printf "%s\t%s\t%s\t%s\n" "$when" "${size_kb:-0}" "$tool" "$(basename "$path")"
            done >> "$MANIFEST"

        # Summary stats
        total=$(tail -n +2 "$MANIFEST" | wc -l)
        size=$(du -sh "$DIR" 2>/dev/null | cut -f1)
        incoming=$(find "$DIR/.incoming" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l)

        {
          echo "## styxcache diagnostic"
          echo "- dir: \`$DIR\`"
          echo "- total entries: $total"
          echo "- total size: $size"
          echo "- orphan staging (.incoming): $incoming"
          echo "- manifest artifact: \`styxcache_manifest.tsv\` (columns: mtime_utc, size_kb, tool, shard)"
          echo ""
          echo "### Top tools by entry count"
          echo "| tool | count | total size |"
          echo "| --- | ---: | ---: |"
        } | emit

        tail -n +2 "$MANIFEST" \
          | awk -F'\t' '{counts[$3]++; sizes[$3]+=$2} END {for(t in counts){printf "%s\t%d\t%d\n",t,counts[t],sizes[t]}}' \
          | sort -k2 -rn \
          | head -n "${TOP_N:-20}" \
          | awk '{printf "| `%s` | %d | %.1f MiB |\n", $1, $2, $3/1024}' \
          | emit

        { echo ""; echo "### Newest 10 entries"; echo "| when (UTC) | tool | size | shard |"; echo "| --- | --- | ---: | --- |"; } | emit
        tail -n +2 "$MANIFEST" | sort -rk1 -t$'\t' | head -10 \
          | awk -F'\t' '{printf "| %s | `%s` | %.1f MiB | `%s` |\n", $1, $3, $2/1024, substr($4,1,16)}' \
          | emit

        { echo ""; echo "### Oldest 10 entries"; echo "| when (UTC) | tool | size | shard |"; echo "| --- | --- | ---: | --- |"; } | emit
        tail -n +2 "$MANIFEST" | sort -k1 -t$'\t' | head -10 \
          | awk -F'\t' '{printf "| %s | `%s` | %.1f MiB | `%s` |\n", $1, $3, $2/1024, substr($4,1,16)}' \
          | emit

    - name: Upload manifest
      uses: actions/upload-artifact@v7
      with:
        name: styxcache-manifest
        path: out/styxcache_manifest.tsv
